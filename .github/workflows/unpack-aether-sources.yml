name: Extract Aether archive contents for source inspection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unpack-aether-sources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso p7zip-full file unzip tar gzip rsync

      - name: Decompress and identify actual format
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aether-unpack/extracted
          gzip -t aether-src-latest.aaf.gz
          gzip -dc aether-src-latest.aaf.gz > /tmp/aether-unpack/aether-src-latest.aaf
          echo 'Compressed input:'
          file aether-src-latest.aaf.gz
          echo 'Decompressed payload:'
          file /tmp/aether-unpack/aether-src-latest.aaf
          wc -c aether-src-latest.aaf.gz /tmp/aether-unpack/aether-src-latest.aaf

          if file /tmp/aether-unpack/aether-src-latest.aaf | grep -qiE 'ISO 9660|ISO image'; then
            echo iso > /tmp/aether-unpack/format
          elif tar -tf /tmp/aether-unpack/aether-src-latest.aaf >/tmp/aether-unpack/archive-list.txt 2>/tmp/aether-unpack/tar-error.txt; then
            echo tar > /tmp/aether-unpack/format
          elif 7z l /tmp/aether-unpack/aether-src-latest.aaf >/tmp/aether-unpack/archive-list.txt 2>/tmp/aether-unpack/7z-error.txt; then
            echo 7z > /tmp/aether-unpack/format
          else
            echo 'Unsupported payload format' >&2
            cat /tmp/aether-unpack/tar-error.txt /tmp/aether-unpack/7z-error.txt >&2 || true
            exit 2
          fi
          echo "Detected format: $(cat /tmp/aether-unpack/format)"
          head -n 100 /tmp/aether-unpack/archive-list.txt || true

      - name: Extract payload
        shell: bash
        run: |
          set -euo pipefail
          case "$(cat /tmp/aether-unpack/format)" in
            iso)
              xorriso -osirrox on -indev /tmp/aether-unpack/aether-src-latest.aaf -extract / /tmp/aether-unpack/extracted
              ;;
            tar)
              tar -xf /tmp/aether-unpack/aether-src-latest.aaf -C /tmp/aether-unpack/extracted
              ;;
            7z)
              7z x -y -o/tmp/aether-unpack/extracted /tmp/aether-unpack/aether-src-latest.aaf
              ;;
          esac
          test -n "$(find /tmp/aether-unpack/extracted -mindepth 1 -print -quit)"
          find /tmp/aether-unpack/extracted -type f -printf '%P\t%s bytes\n' | sort > /tmp/aether-unpack/ARCHIVE-MANIFEST.tsv
          echo "Extracted file count: $(wc -l < /tmp/aether-unpack/ARCHIVE-MANIFEST.tsv)"
          echo 'Top-level entries:'
          find /tmp/aether-unpack/extracted -mindepth 1 -maxdepth 2 -printf '%y %P\n' | sort | head -n 200
          find /tmp/aether-unpack/extracted -type f \( -name Cargo.toml -o -name Makefile -o -name CMakeLists.txt -o -name meson.build -o -name Kbuild -o -name '*.c' -o -name '*.h' -o -name '*.rs' -o -name '*.py' -o -name '*.sh' -o -name README.md -o -name '*.yml' -o -name '*.yaml' \) -printf '%P\n' | sort | head -n 1000 > /tmp/aether-unpack/SOURCE-CANDIDATES.txt
          echo 'Potential source/build files:'
          cat /tmp/aether-unpack/SOURCE-CANDIDATES.txt

      - name: Publish extracted files and inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-unpacked
          mkdir -p source-unpacked/files
          rsync -a --exclude='*.iso' --exclude='*.img' --exclude='*.aaf' --exclude='*.gz' --exclude='*.xz' --exclude='*.zst' --exclude='*.qcow2' --exclude='*.squashfs' --max-size=90m /tmp/aether-unpack/extracted/ source-unpacked/files/
          cp /tmp/aether-unpack/ARCHIVE-MANIFEST.tsv source-unpacked/ARCHIVE-MANIFEST.tsv
          cp /tmp/aether-unpack/SOURCE-CANDIDATES.txt source-unpacked/SOURCE-CANDIDATES.txt
          printf '# Aether extracted contents\n\n' > source-unpacked/README.md
          printf 'The compressed input `aether-src-latest.aaf.gz` was decompressed and identified as **%s**. Files were extracted by GitHub Actions.\n\n' "$(cat /tmp/aether-unpack/format)" >> source-unpacked/README.md
          printf -- '- `ARCHIVE-MANIFEST.tsv`: inventory of every extracted file and its size.\n- `SOURCE-CANDIDATES.txt`: likely source/build files detected by filename.\n- `files/`: extracted files small enough and suitable for Git storage; large disk images and compressed files are excluded.\n\n' >> source-unpacked/README.md
          printf 'This inventory does not assume that every file in the payload is source code; inspect the candidate list and README/build metadata before development.\n' >> source-unpacked/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A source-unpacked
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Extract Aether archive contents for source inspection'
            git push origin HEAD:main
          fi

      - name: Upload extraction diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aether-extraction-diagnostics
          path: |
            /tmp/aether-unpack/aether-src-latest.aaf
            /tmp/aether-unpack/archive-list.txt
            /tmp/aether-unpack/ARCHIVE-MANIFEST.tsv
            /tmp/aether-unpack/SOURCE-CANDIDATES.txt
            /tmp/aether-unpack/tar-error.txt
            /tmp/aether-unpack/7z-error.txt
          if-no-files-found: ignore
          retention-days: 7
