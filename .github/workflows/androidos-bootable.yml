name: Android bootable image

on:
  push:
    branches: [main]
    paths:
      - 'androidos/**'
      - '.github/workflows/androidos-bootable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-efi-amd64-bin grub-common xorriso
      - name: Build image
        working-directory: androidos
        run: bash tools/build-bootable-iso.sh
      - name: Verify image
        run: |
          test -s androidos/out/android-os-bootable.iso
          file androidos/out/android-os-bootable.iso
          isoinfo -d -i androidos/out/android-os-bootable.iso
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: android-os-bootable
          path: androidos/out/android-os-bootable.iso
          if-no-files-found: error
