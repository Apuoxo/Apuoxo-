name: Android-x86 baseline ISO

on:
  push:
    branches: [main]
    paths:
      - 'androidos/**'
      - '.github/workflows/androidos-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso genisoimage
      - name: Fetch and verify upstream Android-x86 ISO
        working-directory: androidos
        run: bash tools/build-iso.sh
      - name: Inspect bootable ISO
        run: |
          test -s androidos/out/android-x86_64-9.0-r2.iso
          test "$(stat -c %s androidos/out/android-x86_64-9.0-r2.iso)" -gt 900000000
          file androidos/out/android-x86_64-9.0-r2.iso
          isoinfo -d -i androidos/out/android-x86_64-9.0-r2.iso
          xorriso -indev androidos/out/android-x86_64-9.0-r2.iso -report_el_torito as_mkisofs
      - name: Upload verified upstream baseline
        uses: actions/upload-artifact@v4
        with:
          name: android-x86-9.0-r2-ah532-baseline
          path: |
            androidos/out/android-x86_64-9.0-r2.iso
            androidos/out/SOURCE.txt
          if-no-files-found: error
          retention-days: 14
