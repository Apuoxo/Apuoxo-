name: Android-like OS ISO

on:
  push:
    branches: [main]
    paths:
      - 'androidos/**'
      - '.github/workflows/androidos-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-common xorriso

      - name: Build and verify ISO
        working-directory: androidos
        run: bash tools/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: android-like-os-iso
          path: androidos/out/android-like-os.iso
          if-no-files-found: error
