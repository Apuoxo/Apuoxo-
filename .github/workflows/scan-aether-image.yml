name: Scan Aether build image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/scan-aether-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file xorriso p7zip-full binutils grep tar gzip

      - name: Identify and inspect build image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aether-scan/extracted image-scan
          IMG="aether-BUILD-20261015-B91.aaf"
          test -f "$IMG"
          {
            echo "# Aether build image scan"
            echo
            echo "- Input: $IMG"
            echo "- Scan timestamp (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- SHA-256: $(sha256sum "$IMG" | awk '{print $1}')"
            echo "- Size: $(stat -c '%s bytes' "$IMG")"
            echo
            echo "## File identification"
            file "$IMG"
            echo
            echo "## Header bytes"
            od -An -tx1 -N96 "$IMG"
            echo
          } > /tmp/aether-scan/REPORT.md

          FORMAT=unknown
          if file "$IMG" | grep -qiE 'ISO 9660|ISO image'; then
            FORMAT=iso
          elif tar -tf "$IMG" >/tmp/aether-scan/list.txt 2>/tmp/aether-scan/tar.err; then
            FORMAT=tar
          elif 7z l "$IMG" >/tmp/aether-scan/7z-list.txt 2>/tmp/aether-scan/7z.err; then
            FORMAT=7z
          fi
          echo "## Detected container format" >> /tmp/aether-scan/REPORT.md
          echo "$FORMAT" >> /tmp/aether-scan/REPORT.md
          echo >> /tmp/aether-scan/REPORT.md

          case "$FORMAT" in
            iso)
              xorriso -indev "$IMG" -toc > /tmp/aether-scan/toc.txt 2>&1 || true
              xorriso -osirrox on -indev "$IMG" -extract / /tmp/aether-scan/extracted > /tmp/aether-scan/extract.log 2>&1
              ;;
            tar)
              tar -tf "$IMG" > /tmp/aether-scan/list.txt
              tar -xf "$IMG" -C /tmp/aether-scan/extracted
              ;;
            7z)
              7z l "$IMG" > /tmp/aether-scan/7z-list.txt
              7z x -y -o/tmp/aether-scan/extracted "$IMG" > /tmp/aether-scan/extract.log
              ;;
            unknown)
              echo "Unsupported or unrecognized container format" >> /tmp/aether-scan/REPORT.md
              ;;
          esac

          if [ -d /tmp/aether-scan/extracted ]; then
            find /tmp/aether-scan/extracted -type f -printf '%P\t%s bytes\n' | sort > /tmp/aether-scan/file-list.tsv
          fi
          {
            echo "## File inventory"
            echo
            if [ -f /tmp/aether-scan/file-list.tsv ]; then
              echo "Extracted file count: $(wc -l < /tmp/aether-scan/file-list.tsv)"
              echo
              echo "First 300 paths:"
              echo
              head -n 300 /tmp/aether-scan/file-list.tsv
            elif [ -f /tmp/aether-scan/list.txt ]; then
              echo "Archive file list:"
              echo
              head -n 300 /tmp/aether-scan/list.txt
            else
              echo "No filesystem listing was obtained."
            fi
            echo
            echo "## Boot, kernel, and OS markers"
            echo
          } >> /tmp/aether-scan/REPORT.md

          if [ -d /tmp/aether-scan/extracted ]; then
            find /tmp/aether-scan/extracted -type f \( -iname '*grub*' -o -iname '*kernel*' -o -iname 'vmlinuz*' -o -iname 'initrd*' -o -iname 'bzimage*' -o -iname 'efi*' -o -iname 'manifest*' -o -iname 'os-release' -o -iname 'Cargo.toml' -o -iname 'main.rs' -o -iname 'README*' \) -printf '%P\n' | sort > /tmp/aether-scan/markers.txt
            {
              cat /tmp/aether-scan/markers.txt
              echo
              echo "## Likely source/build files"
              find /tmp/aether-scan/extracted -type f \( -name Cargo.toml -o -name Makefile -o -name CMakeLists.txt -o -name '*.rs' -o -name '*.c' -o -name '*.h' -o -name '*.py' -o -name '*.sh' -o -name '*.cfg' -o -name '*.ld' \) -printf '%P\n' | sort | head -n 500
            } >> /tmp/aether-scan/REPORT.md
          fi

          cp /tmp/aether-scan/REPORT.md image-scan/REPORT.md
          if [ -f /tmp/aether-scan/file-list.tsv ]; then cp /tmp/aether-scan/file-list.tsv image-scan/FILE-INVENTORY.tsv; fi
          if [ -f /tmp/aether-scan/markers.txt ]; then cp /tmp/aether-scan/markers.txt image-scan/BOOT-OS-MARKERS.txt; fi
          {
            echo
            echo "## Quick interpretation"
            echo
            echo "This is a structural inventory, not a boot test or proof that every listed component is functional."
            echo "The format and paths above were determined by tools run against the committed image."
          } >> image-scan/REPORT.md

      - name: Publish scan report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image-scan
          if git diff --cached --quiet; then
            echo 'No report changes to publish.'
          else
            git commit -m 'Add structural scan report for Aether build image'
            git push origin HEAD:main
          fi

      - name: Upload scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-build-image-scan
          path: /tmp/aether-scan/
          if-no-files-found: ignore
          retention-days: 7
